name: 🔨 Auto Build ImmortalWrt for Samsung J5 (ARM64 + lk2nd)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '📱 Device Model'
        required: true
        default: 'samsung-j5'
        type: choice
        options:
          - samsung-j5
          - samsung-j5nlte
          - samsung-j5lte
      wifi_ssid:
        description: '📶 WiFi SSID'
        required: true
        default: 'J5-WiFi'
      wifi_password:
        description: '🔑 WiFi Password (min 8 chars)'
        required: true
        default: '12345678'
      apn:
        description: '📡 APN for 4G/LTE'
        required: true
        default: 'internet'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-dev \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          time \
          cpio \
          xxd \
          bc \
          lzma \
          lzop \
          perl \
          libelf-dev \
          device-tree-compiler \
          u-boot-tools

        sudo ln -sf /usr/bin/python3 /usr/bin/python
        pip3 install --upgrade pip setuptools wheel
        echo "✅ Build environment ready!"

    - name: 💾 Check and add swap space
      run: |
        echo "📊 Memory sebelum swap:"
        free -h
        echo ""
        if swapon --show | grep -q "/swapfile"; then
          echo "✅ Swap file sudah ada, skip pembuatan."
        else
          echo "📦 Creating 4GB swap file..."
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
        fi
        echo ""
        echo "📊 Memory setelah swap:"
        free -h

    - name: 🧹 Clean workspace
      run: |
        sudo rm -rf /tmp/*
        docker system prune -af || true
        df -h

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 📦 Clone ImmortalWrt
      run: |
        git clone -b openwrt-23.05 --single-branch --depth=1 \
          https://github.com/immortalwrt/immortalwrt.git
        cd immortalwrt
        echo "✅ Cloned branch: $(git branch --show-current)"
        echo "IMMORTALWRT_VERSION=$(git describe --tags --always 2>/dev/null || echo 'snapshot')" >> $GITHUB_ENV

    - name: 💾 Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          immortalwrt/dl
          immortalwrt/build_dir
          immortalwrt/staging_dir
          immortalwrt/tmp
        key: ${{ runner.os }}-immortalwrt-arm64-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-arm64-

    - name: 📄 Generate Device Tree files (ARM64)
      run: |
        cd immortalwrt
        
        # Buat direktori DTS untuk ARM64
        KERNEL_DTS_DIR="target/linux/generic/files-6.6/arch/arm64/boot/dts/qcom"
        mkdir -p $KERNEL_DTS_DIR
        
        echo "📥 Downloading DTS files for Samsung J5..."
        
        # Download DTS dari kernel mainline
        curl -s -o $KERNEL_DTS_DIR/msm8916-samsung-j5-common.dtsi \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        
        curl -s -o $KERNEL_DTS_DIR/msm8916-samsung-j5.dts \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        
        curl -s -o $KERNEL_DTS_DIR/msm8916-samsung-j5nlte.dts \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5nlte.dts || echo "J5NLTE DTS not found"
        
        # Verifikasi
        echo "✅ DTS files downloaded:"
        ls -la $KERNEL_DTS_DIR/

    - name: ⚙️ Generate uci-defaults scripts
      run: |
        cd immortalwrt
        
        # Buat direktori untuk uci-defaults
        mkdir -p files/etc/uci-defaults
        
        # WiFi auto-enable
        cat > files/etc/uci-defaults/99-wifi-auto << 'EOF'
        #!/bin/sh
        sleep 3
        SSID="${WIFI_SSID:-J5-WiFi}"
        PASSWORD="${WIFI_PASSWORD:-12345678}"
        
        if [ -f /etc/config/wireless ]; then
          for radio in $(uci show wireless | grep "=wifi-device" | cut -d'=' -f1); do
            uci set $radio.disabled='0'
          done
          
          iface="wireless.@wifi-iface[0]"
          if uci get $iface >/dev/null 2>&1; then
            uci set $iface.ssid="$SSID"
            uci set $iface.encryption='psk2'
            uci set $iface.key="$PASSWORD"
            uci set $iface.network='lan'
            uci set $iface.mode='ap'
          fi
          
          uci commit wireless
          /etc/init.d/network restart
          /etc/init.d/wireless restart
          echo "✅ WiFi configured: SSID=$SSID"
        fi
        EOF
        
        # Modem auto-setup
        cat > files/etc/uci-defaults/99-modem-auto << 'EOF'
        #!/bin/sh
        APN="${APN:-internet}"
        
        # Enable ModemManager
        uci set modemmanager.@modemmanager[0].enable='1' 2>/dev/null || true
        
        # Setup QMI interface
        uci set network.wan=interface
        uci set network.wan.proto='qmi'
        uci set network.wan.device='/dev/cdc-wdm0'
        uci set network.wan.apn="$APN"
        uci set network.wan.auth='none'
        uci set network.wan.iptype='ipv4'
        
        uci commit modemmanager
        uci commit network
        
        /etc/init.d/modemmanager enable
        /etc/init.d/modemmanager restart
        /etc/init.d/network restart
        
        echo "✅ Modem configured with APN: $APN"
        EOF
        
        # rc.local (fallback)
        cat > files/etc/rc.local << 'EOF'
        #!/bin/sh -e
        sleep 15
        
        # Force WiFi up if not running
        if ! pgrep hostapd >/dev/null; then
          echo "🔄 WiFi not running, restarting..."
          /etc/init.d/wireless restart
          sleep 3
        fi
        
        # Force modem detection
        if [ ! -e /dev/cdc-wdm0 ]; then
          echo "🔄 Modem not detected, resetting USB..."
          echo 1 > /sys/bus/usb/devices/1-1/remove 2>/dev/null || true
          sleep 2
          echo 1 > /sys/bus/usb/devices/1-1/rescan 2>/dev/null || true
          sleep 5
          /etc/init.d/modemmanager restart
        fi
        
        exit 0
        EOF
        
        chmod +x files/etc/uci-defaults/*
        chmod +x files/etc/rc.local
        echo "✅ UCI defaults scripts generated!"

    - name: 📝 Generate msm8916.mk for ARM64
      run: |
        cd immortalwrt
        
        # Buat direktori image
        mkdir -p target/linux/generic/image
        
        # Buat file definisi perangkat
        cat > target/linux/generic/image/msm8916.mk << 'EOF'
        include $(TOPDIR)/rules.mk
        
        DEVICE_VARS += DEVICE_DTS
        
        define Device/qcom-msm8916
          DEVICE_VENDOR := Qualcomm
          DEVICE_MODEL := MSM8916
          IMAGES := combined.img rootfs.img
          KERNEL_LOADADDR := 0x80008000
          KERNEL_ENTRY := 0x80008000
          BOOT_SCRIPT := boot-msm89xx
          IMAGE_SIZE := 32m
          KERNEL := kernel-bin | gzip | fit gzip
          KERNEL_INITRAMFS := kernel-bin | gzip | fit gzip
          IMAGE/combined.img := append-kernel | append-rootfs | pad-rootfs | append-metadata
          IMAGE/rootfs.img := append-rootfs
        endef
        
        define Device/samsung-j5
          $(Device/qcom-msm8916)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5
          DEVICE_DTS := qcom/msm8916-samsung-j5
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             kmod-usb-phy-qcom-msm dnsmasq-full
        endef
        TARGET_DEVICES += samsung-j5
        
        define Device/samsung-j5nlte
          $(Device/qcom-msm8916)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5 (2016)
          DEVICE_DTS := qcom/msm8916-samsung-j5nlte
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5nlte
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             kmod-usb-phy-qcom-msm dnsmasq-full
        endef
        TARGET_DEVICES += samsung-j5nlte
        EOF
        
        echo "✅ msm8916.mk generated for ARM64 with dnsmasq-full!"

    - name: 🔄 Update feeds
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "✅ Feeds updated!"

    - name: ⚙️ Generate ARM64 .config
      run: |
        cd immortalwrt
        
        WIFI_SSID="${{ github.event.inputs.wifi_ssid }}"
        WIFI_PASSWORD="${{ github.event.inputs.wifi_password }}"
        APN="${{ github.event.inputs.apn }}"
        DEVICE="${{ github.event.inputs.device_model }}"
        
        cat > .config << 'EOF'
        # ============================================================
        # TARGET: ARM64 / aarch64 untuk Samsung J5 (MSM8916)
        # ============================================================
        
        CONFIG_TARGET_arm64=y
        CONFIG_TARGET_arm64_generic=y
        CONFIG_TARGET_arm64_generic_DEVICE_DEVICE_PLACEHOLDER=y
        
        # Subtarget untuk Qualcomm MSM89xx
        CONFIG_TARGET_arm64_generic_SUBTARGET_msm89xx=y
        
        # Root filesystem
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_TARGET_IMAGES_ITB=y
        
        # Kernel
        CONFIG_KERNEL_DEVICETREE=y
        CONFIG_KERNEL_DTBS="qcom/msm8916-samsung-j5.dtb"
        CONFIG_KERNEL_FIT_IMAGE=y
        CONFIG_KERNEL_FIT_SIGNATURE=n
        
        # Optimasi ukuran
        CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt -fhonour-copts -Wno-error=unused-but-set-variable -Wno-error=unused-result"
        CONFIG_STRIP_KERNEL_EXPORTS=y
        CONFIG_USE_SSTRIP=y
        CONFIG_STRIP_ALL=y
        
        # ============================================================
        # BASE SYSTEM - DENGAN DNSMASQ-FULL
        # ============================================================
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_busybox-config-mdev=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_dnsmasq-full=y
        # CONFIG_PACKAGE_dnsmasq is not set (HAPUS agar tidak conflict)
        
        # ============================================================
        # LUCI - LIGHT
        # ============================================================
        CONFIG_PACKAGE_luci-light=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        # ============================================================
        # WIFI
        # ============================================================
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_iwinfo=y
        CONFIG_PACKAGE_wpad-basic=y
        CONFIG_PACKAGE_hostapd=y
        CONFIG_PACKAGE_wireless-tools=y
        CONFIG_PACKAGE_wpa-supplicant=y
        
        # ============================================================
        # USB + MODEM 4G
        # ============================================================
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
        CONFIG_PACKAGE_kmod-usb-serial-wwan=y
        CONFIG_PACKAGE_usbutils=y
        
        # Qualcomm USB PHY
        CONFIG_PACKAGE_kmod-usb-phy-qcom-msm=y
        
        # ModemManager
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_luci-app-modemmanager=y
        CONFIG_PACKAGE_mobile-broadband-provider-info=y
        CONFIG_PACKAGE_libmbim=y
        CONFIG_PACKAGE_libqmi=y
        CONFIG_PACKAGE_umbim=y
        CONFIG_PACKAGE_uqmi=y
        
        # ============================================================
        # TOOLS
        # ============================================================
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        CONFIG_PACKAGE_ip-full=y
        
        # ============================================================
        # BUSYBOX
        # ============================================================
        CONFIG_BUSYBOX_DEFAULT_FEATURE_EXTRA_QUIET=y
        CONFIG_BUSYBOX_DEFAULT_FEATURE_SYSLOG=y
        
        # ============================================================
        # TIDAK TERMASUK (untuk menghemat ukuran)
        # ============================================================
        # CONFIG_PACKAGE_kmod-wireguard is not set
        # CONFIG_PACKAGE_wifischedule is not set
        # CONFIG_PACKAGE_htop is not set
        # CONFIG_PACKAGE_nano is not set
        # CONFIG_PACKAGE_tcpdump is not set
        EOF
        
        # Ganti placeholder dengan device yang dipilih
        sed -i "s/DEVICE_PLACEHOLDER/$DEVICE/g" .config
        
        export WIFI_SSID="$WIFI_SSID"
        export WIFI_PASSWORD="$WIFI_PASSWORD"
        export APN="$APN"
        
        make defconfig
        
        echo ""
        echo "📋 VERIFIKASI TARGET:"
        echo "====================="
        grep "CONFIG_TARGET" .config | grep -v "is not set" || true
        echo ""
        echo "📋 VERIFIKASI DNSMASQ:"
        grep "CONFIG_PACKAGE_dnsmasq" .config | grep -v "is not set" || true
        echo ""
        echo "✅ ARM64 .config generated!"

    - name: 📥 Download sources
      run: |
        cd immortalwrt
        make download -j8 V=s
        echo "✅ Sources downloaded!"

    - name: 🔨 Build firmware
      run: |
        cd immortalwrt
        echo "🚀 Building ARM64 firmware for Samsung J5..."
        echo "⏰ Estimated time: 2-3 hours"
        make -j4 V=s || make -j1 V=s
        echo "✅ Build completed!"

    - name: 📂 List build output
      if: always()
      run: |
        echo "=========================================="
        echo "📂 MENCARI FILE HASIL BUILD"
        echo "=========================================="
        cd immortalwrt
        
        echo ""
        echo "📂 1. Cari semua file .img, .bin, .dtb, .itb:"
        find bin/targets/ -name "*.img" -o -name "*.bin" -o -name "*.dtb" -o -name "*.itb" 2>/dev/null || echo "Tidak ada file ditemukan"
        
        echo ""
        echo "📂 2. Cek struktur direktori bin/targets/:"
        ls -la bin/targets/ 2>/dev/null || echo "Folder bin/targets/ tidak ditemukan"
        
        echo ""
        echo "📂 3. Cek folder arm64:"
        ls -la bin/targets/arm64/ 2>/dev/null || echo "Folder arm64 tidak ditemukan"
        
        echo ""
        echo "📂 4. Cek folder arm64/generic:"
        ls -la bin/targets/arm64/generic/ 2>/dev/null || echo "Folder generic tidak ditemukan"
        
        echo ""
        echo "📂 5. Cek folder arm64/generic/msm89xx:"
        ls -la bin/targets/arm64/generic/msm89xx/ 2>/dev/null || echo "Folder msm89xx tidak ditemukan"
        
        echo ""
        echo "📂 6. Cari folder msm89xx di mana saja:"
        find bin/targets/ -type d -name "*msm89xx*" 2>/dev/null || echo "Tidak ditemukan"
        
        echo ""
        echo "=========================================="

    - name: 📤 Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-j5-arm64-${{ github.run_number }}
        path: |
          immortalwrt/bin/targets/arm64/generic/*.img
          immortalwrt/bin/targets/arm64/generic/*.itb
          immortalwrt/bin/targets/arm64/generic/*.bin
          immortalwrt/bin/targets/arm64/generic/*.dtb
          immortalwrt/bin/targets/arm64/generic/*.manifest
          immortalwrt/.config
        retention-days: 7
        compression: gzip

    - name: 📤 Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-arm64-${{ github.run_number }}
        path: |
          immortalwrt/logs/
          immortalwrt/.config
          immortalwrt/build_dir/target-*/**/*.log
        retention-days: 7

    - name: 🚀 Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: j5-arm64-${{ github.run_number }}
        name: 📦 ImmortalWrt J5 - ARM64 Build #${{ github.run_number }}
        body: |
          ## 📱 ImmortalWrt for Samsung J5 - ARM64
          
          ### 📊 Build Info
          | Item | Value |
          |------|-------|
          | **Device** | `${{ github.event.inputs.device_model }}` |
          | **Architecture** | ARM64 / aarch64 |
          | **Bootloader** | Compatible with lk2nd |
          | **DNS** | dnsmasq-full (fitur lengkap) |
          | **WiFi SSID** | `${{ github.event.inputs.wifi_ssid }}` |
          | **APN** | `${{ github.event.inputs.apn }}` |
          | **Build Date** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          
          ### 📦 Included Packages
          - ✅ Linux Kernel + Device Tree
          - ✅ BusyBox (core utilities)
          - ✅ Dropbear (SSH server)
          - ✅ Firewall + **dnsmasq-full** (DNS + DHCP lengkap)
          - ✅ LuCI Light (web UI minimal)
          - ✅ WiFi (hostapd + wpad-basic)
          - ✅ Modem 4G (ModemManager + QMI)
          - ✅ curl + wget + ip-full
          
          ### ❌ NOT INCLUDED (Ultra Minimal)
          - WireGuard VPN
          - WiFi Schedule
          - Bluetooth
          - Audio
          - USB Storage
          - LuCI Apps (openclash, adguardhome, dll)
          - htop, nano, tcpdump
          
          ### 📁 File Types
          - `*.itb` - FIT Image (for U-Boot/lk2nd)
          - `*.img` - Combined firmware image
          - `*.dtb` - Device Tree Blob
          
          ### ⚠️ Flashing with lk2nd
          1. Enter EDL mode or fastboot
          2. Flash boot image: `fastboot flash boot openwrt-*.itb`
          3. Flash rootfs: `fastboot flash rootfs openwrt-*.img`
          4. Reboot: `fastboot reboot`
          
          ### 🌐 Defaults
          - IP: 192.168.1.1
          - WiFi: `${{ github.event.inputs.wifi_ssid }}` / `${{ github.event.inputs.wifi_password }}`
          - APN: `${{ github.event.inputs.apn }}`
          
          ---
          **⚠️ DISCLAIMER**: Use at your own risk. Not responsible for bricked devices.
        files: |
          immortalwrt/bin/targets/arm64/generic/*.img
          immortalwrt/bin/targets/arm64/generic/*.itb
          immortalwrt/bin/targets/arm64/generic/*.bin
          immortalwrt/bin/targets/arm64/generic/*.dtb
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}