name: 🔨 Auto Build ImmortalWrt for Samsung J5 (MSM8916)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '📱 Device Model'
        required: true
        default: 'samsung-j5'
        type: choice
        options:
          - samsung-j5
          - samsung-j5nlte
          - samsung-j5lte
      kernel_version:
        description: '🐧 Kernel Version'
        required: true
        default: '6.6'
        type: choice
        options:
          - '6.6'
          - '6.12'
      wifi_ssid:
        description: '📶 WiFi SSID'
        required: true
        default: 'ImmortalWrt-J5'
      wifi_password:
        description: '🔑 WiFi Password (min 8 chars)'
        required: true
        default: 'changeme123'
      apn:
        description: '📡 APN for 4G/LTE'
        required: true
        default: 'internet'
      extra_packages:
        description: '📦 Extra packages (space separated)'
        required: false
        default: 'luci-app-openclash luci-app-adguardhome luci-app-wireguard'
      build_type:
        description: '⚙️ Build Type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - minimal
          - custom
      immortalwrt_branch:
        description: '🌿 ImmortalWrt Branch'
        required: true
        default: 'openwrt-23.05'
        type: choice
        options:
          - openwrt-23.05
          - openwrt-24.10
          - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ✅ Diperpanjang dari 240 ke 360 menit (6 jam)
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
    # ============================================
    # STEP 1: Setup Environment
    # ============================================
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-dev \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          time \
          qemu-utils \
          qemu-system-arm \
          cpio \
          xxd \
          bc \
          lzma \
          lzop \
          perl \
          libelf-dev \
          linux-headers-generic \
          nodejs \
          npm
        
        # Fix python3-distutils issue
        sudo apt-get install -y python3-distutils || true
        sudo apt-get install -y python3-venv || true
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        
        # Upgrade pip
        pip3 install --upgrade pip setuptools wheel
        
        echo "✅ Build environment ready!"

    - name: 🧹 Clean workspace
      run: |
        sudo rm -rf /tmp/*
        docker system prune -af || true
        df -h

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # ============================================
    # STEP 2: Clone ImmortalWrt
    # ============================================
    - name: 📦 Clone ImmortalWrt source
      run: |
        cd $GITHUB_WORKSPACE
        BRANCH="${{ github.event.inputs.immortalwrt_branch }}"
        
        echo "🌿 Cloning branch: $BRANCH"
        
        git clone -b "$BRANCH" --single-branch --depth=1 \
          https://github.com/immortalwrt/immortalwrt.git
        
        cd immortalwrt
        echo "✅ Cloned branch: $(git branch --show-current)"
        git log -1 --oneline
        echo "IMMORTALWRT_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV

    # ============================================
    # STEP 3: Cache build artifacts (✅ DITAMBAHKAN)
    # ============================================
    - name: 💾 Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          immortalwrt/dl
          immortalwrt/build_dir
          immortalwrt/staging_dir
          immortalwrt/tmp
        key: ${{ runner.os }}-immortalwrt-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-
          ${{ runner.os }}-immortalwrt-${{ github.event.inputs.immortalwrt_branch }}

    # ============================================
    # STEP 4: Auto-generate DTS files
    # ============================================
    - name: 📄 Auto-generate Device Tree files
      run: |
        cd immortalwrt
        
        KERNEL_DIR="target/linux/msm89xx/files-${{ github.event.inputs.kernel_version }}"
        mkdir -p $KERNEL_DIR/arch/arm64/boot/dts/qcom
        
        echo "📥 Downloading DTS files from mainline kernel..."
        
        curl -s -o $KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        
        curl -s -o $KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        
        curl -s -o $KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5nlte.dts \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5nlte.dts || echo "J5NLTE DTS not found"
        
        echo "✅ DTS files downloaded!"

    # ============================================
    # STEP 5: Generate configuration files
    # ============================================
    - name: ⚙️ Generate configuration files
      run: |
        cd immortalwrt
        
        KERNEL_DIR="target/linux/msm89xx/files-${{ github.event.inputs.kernel_version }}"
        mkdir -p $KERNEL_DIR/etc/uci-defaults
        mkdir -p $KERNEL_DIR/etc/config
        
        # WiFi auto-enable
        cat > $KERNEL_DIR/etc/uci-defaults/99-wifi-auto << 'EOF'
        #!/bin/sh
        sleep 3
        SSID="${WIFI_SSID:-ImmortalWrt-J5}"
        PASSWORD="${WIFI_PASSWORD:-changeme123}"
        
        if [ -f /etc/config/wireless ]; then
          for radio in $(uci show wireless | grep "=wifi-device" | cut -d'=' -f1); do
            uci set $radio.disabled='0'
          done
          iface="wireless.@wifi-iface[0]"
          if uci get $iface >/dev/null 2>&1; then
            uci set $iface.ssid="$SSID"
            uci set $iface.encryption='psk2'
            uci set $iface.key="$PASSWORD"
            uci set $iface.network='lan'
            uci set $iface.mode='ap'
          fi
          uci commit wireless
          /etc/init.d/network restart
          /etc/init.d/wireless restart
          echo "✅ WiFi configured: SSID=$SSID"
        fi
        EOF
        
        # Modem auto-setup
        cat > $KERNEL_DIR/etc/uci-defaults/99-modem-auto << 'EOF'
        #!/bin/sh
        APN="${APN:-internet}"
        uci set modemmanager.@modemmanager[0].enable='1' 2>/dev/null || true
        uci set network.wan=interface
        uci set network.wan.proto='qmi'
        uci set network.wan.device='/dev/cdc-wdm0'
        uci set network.wan.apn="$APN"
        uci set network.wan.auth='none'
        uci commit modemmanager
        uci commit network
        /etc/init.d/modemmanager enable
        /etc/init.d/modemmanager restart
        /etc/init.d/network restart
        echo "✅ Modem configured with APN: $APN"
        EOF
        
        # rc.local
        cat > $KERNEL_DIR/etc/rc.local << 'EOF'
        #!/bin/sh -e
        sleep 15
        if ! pgrep hostapd >/dev/null; then
          /etc/init.d/wireless restart
        fi
        if [ ! -e /dev/cdc-wdm0 ]; then
          echo 1 > /sys/bus/usb/devices/1-1/remove 2>/dev/null || true
          sleep 2
          echo 1 > /sys/bus/usb/devices/1-1/rescan 2>/dev/null || true
          /etc/init.d/modemmanager restart
        fi
        exit 0
        EOF
        
        # Network config
        cat > $KERNEL_DIR/etc/config/network << 'EOF'
        config interface 'loopback'
          option ifname 'lo'
          option proto 'static'
          option ipaddr '127.0.0.1'
          option netmask '255.0.0.0'
        
        config interface 'lan'
          option type 'bridge'
          option ifname 'eth0'
          option proto 'static'
          option ipaddr '192.168.1.1'
          option netmask '255.255.255.0'
        
        config interface 'wan'
          option proto 'qmi'
          option device '/dev/cdc-wdm0'
          option apn 'internet'
          option auth 'none'
        EOF
        
        chmod +x $KERNEL_DIR/etc/uci-defaults/*
        chmod +x $KERNEL_DIR/etc/rc.local
        echo "✅ Configuration files generated!"

    # ============================================
    # STEP 6: Generate msm8916.mk
    # ============================================
    - name: 📝 Generate msm8916.mk
      run: |
        cd immortalwrt
        mkdir -p target/linux/msm89xx/image
        
        cat > target/linux/msm89xx/image/msm8916.mk << 'EOF'
        include $(TOPDIR)/rules.mk
        
        DEVICE_VARS += DEVICE_DTS
        
        define Device/Qcom
          DEVICE_VENDOR := Qualcomm
          IMAGES := combined.img rootfs.img
          KERNEL_LOADADDR := 0x80008000
          KERNEL_ENTRY := 0x80008000
          BOOT_SCRIPT := boot-msm89xx
          IMAGE_SIZE := 32m
          KERNEL := kernel-bin | gzip | fit gzip
          KERNEL_INITRAMFS := kernel-bin | gzip | fit gzip
          IMAGE/combined.img := append-kernel | append-rootfs | pad-rootfs | append-metadata
          IMAGE/rootfs.img := append-rootfs
        endef
        
        define Device/samsung-j5
          $(Device/Qcom)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5 (2015)
          DEVICE_DTS := qcom/msm8916-samsung-j5
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             wifischedule kmod-wireguard
        endef
        TARGET_DEVICES += samsung-j5
        
        define Device/samsung-j5nlte
          $(Device/Qcom)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5 (2016)
          DEVICE_DTS := qcom/msm8916-samsung-j5nlte
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5nlte
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             wifischedule kmod-wireguard
        endef
        TARGET_DEVICES += samsung-j5nlte
        EOF
        
        echo "✅ msm8916.mk generated!"

    # ============================================
    # STEP 7: Update feeds
    # ============================================
    - name: 🔄 Update feeds
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "✅ Feeds updated!"

    # ============================================
    # STEP 8: Generate .config
    # ============================================
    - name: ⚙️ Generate .config
      run: |
        cd immortalwrt
        
        DEVICE="${{ github.event.inputs.device_model }}"
        WIFI_SSID="${{ github.event.inputs.wifi_ssid }}"
        WIFI_PASSWORD="${{ github.event.inputs.wifi_password }}"
        APN="${{ github.event.inputs.apn }}"
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        
        cat > .config << 'EOF'
        CONFIG_TARGET_msm89xx=y
        CONFIG_TARGET_msm89xx_msm8916=y
        CONFIG_TARGET_msm89xx_msm8916_DEVICE_DEVICE_PLACEHOLDER=y
        
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_dnsmasq=y
        
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        CONFIG_PACKAGE_wireless-tools=y
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_iwinfo=y
        CONFIG_PACKAGE_wpad-basic=y
        CONFIG_PACKAGE_hostapd=y
        
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
        CONFIG_PACKAGE_usbutils=y
        
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_luci-app-modemmanager=y
        CONFIG_PACKAGE_mobile-broadband-provider-info=y
        
        CONFIG_PACKAGE_wifischedule=y
        CONFIG_PACKAGE_kmod-wireguard=y
        CONFIG_PACKAGE_wireguard-tools=y
        CONFIG_PACKAGE_luci-app-wireguard=y
        
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        EOF
        
        sed -i "s/DEVICE_PLACEHOLDER/$DEVICE/g" .config
        
        export WIFI_SSID="$WIFI_SSID"
        export WIFI_PASSWORD="$WIFI_PASSWORD"
        export APN="$APN"
        
        if [ -n "${{ github.event.inputs.extra_packages }}" ]; then
          for pkg in ${{ github.event.inputs.extra_packages }}; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
        fi
        
        if [ "$BUILD_TYPE" = "minimal" ]; then
          sed -i '/CONFIG_PACKAGE_luci-app-/d' .config
          sed -i '/CONFIG_PACKAGE_htop/d' .config
          echo "CONFIG_PACKAGE_luci-light=y" >> .config
        fi
        
        make defconfig
        echo "✅ .config generated!"

    # ============================================
    # STEP 9: Download and Build
    # ============================================
    - name: 📥 Download package sources
      run: |
        cd immortalwrt
        make download -j8 V=s
        echo "✅ Sources downloaded!"

    - name: 🔨 Build firmware
      run: |
        cd immortalwrt
        echo "🚀 Starting build... (~2-3 hours)"
        echo "⏰ Timeout: 360 minutes (6 hours)"
        make -j$(nproc) V=s || make -j1 V=s
        echo "✅ Build completed!"

    # ============================================
    # STEP 10: Upload artifacts
    # ============================================
    - name: 📤 Upload firmware artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-j5-${{ github.run_number }}
        path: |
          immortalwrt/bin/targets/msm89xx/msm8916/*.img
          immortalwrt/bin/targets/msm89xx/msm8916/*.bin
          immortalwrt/bin/targets/msm89xx/msm8916/*.dtb
          immortalwrt/bin/targets/msm89xx/msm8916/*.manifest
          immortalwrt/bin/targets/msm89xx/msm8916/*.sha256sums
          immortalwrt/.config
        retention-days: 7

    - name: 📤 Upload build logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          immortalwrt/logs/
          immortalwrt/.config
        retention-days: 7

    # ============================================
    # STEP 11: Create Release
    # ============================================
    - name: 🚀 Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: j5-build-${{ github.run_number }}
        name: 🚀 ImmortalWrt J5 - Build #${{ github.run_number }}
        body: |
          ## 📱 ImmortalWrt for Samsung Galaxy J5
          
          | Item | Value |
          |------|-------|
          | **Device** | `${{ github.event.inputs.device_model }}` |
          | **Kernel** | ${{ github.event.inputs.kernel_version }} |
          | **Build Type** | ${{ github.event.inputs.build_type }} |
          | **WiFi SSID** | `${{ github.event.inputs.wifi_ssid }}` |
          | **APN** | `${{ github.event.inputs.apn }}` |
          | **Branch** | `${{ github.event.inputs.immortalwrt_branch }}` |
          
          ### 📦 Included Packages
          ```
          ${{ github.event.inputs.extra_packages }}
          ```
          
          ### ✨ Features
          - ✅ WiFi auto-on at boot
          - ✅ 4G/LTE Modem auto-configured
          - ✅ WiFi Schedule (06:00-23:59)
          - ✅ WireGuard VPN ready
          - ✅ ModemManager with QMI support
          - ✅ LuCI web interface
          
          ### ⚠️ Flashing Instructions
          1. Enter EDL mode: Volume Down + Home + Power
          2. Backup original partitions (IMPORTANT!)
          3. Flash using QFIL or EDL tool
          4. Extract modem firmware: modem.bin, fsc.bin, fsg.bin
          
          ### 🌐 Defaults
          - IP: 192.168.1.1
          - WiFi: ${{ github.event.inputs.wifi_ssid }} / ${{ github.event.inputs.wifi_password }}
          - APN: ${{ github.event.inputs.apn }}
          
          ---
          **⚠️ DISCLAIMER**: Use at your own risk. Not responsible for bricked devices.
          
          💬 **Support**: Open an issue if you encounter problems.
        files: |
          immortalwrt/bin/targets/msm89xx/msm8916/*.img
          immortalwrt/bin/targets/msm89xx/msm8916/*.bin
          immortalwrt/bin/targets/msm89xx/msm8916/*.dtb
          immortalwrt/bin/targets/msm89xx/msm8916/*.sha256sums
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}