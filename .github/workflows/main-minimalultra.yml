name: 🔨 Auto Build ImmortalWrt for Samsung J5 (ULTRA MINIMAL)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '📱 Device Model'
        required: true
        default: 'samsung-j5'
        type: choice
        options:
          - samsung-j5
          - samsung-j5nlte
          - samsung-j5lte
      wifi_ssid:
        description: '📶 WiFi SSID'
        required: true
        default: 'J5-WiFi'
      wifi_password:
        description: '🔑 WiFi Password (min 8 chars)'
        required: true
        default: '12345678'
      apn:
        description: '📡 APN for 4G/LTE'
        required: true
        default: 'internet'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write

    steps:
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-dev \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          time \
          cpio \
          xxd \
          bc \
          lzma \
          lzop \
          perl \
          libelf-dev
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        echo "✅ Build environment ready!"

    - name: 💾 Check and add swap space (if needed)
      run: |
        echo "📊 Memory saat ini:"
        free -h
        echo ""
        
        if swapon --show | grep -q "/swapfile"; then
          echo "✅ Swap file sudah ada, skip pembuatan."
        else
          echo "📦 Creating 4GB swap file..."
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ Swap added successfully!"
        fi
        
        echo ""
        echo "📊 Memory setelah swap:"
        free -h

    - name: 🧹 Clean workspace
      run: |
        sudo rm -rf /tmp/*
        docker system prune -af || true

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 📦 Clone ImmortalWrt
      run: |
        git clone -b openwrt-23.05 --single-branch --depth=1 \
          https://github.com/immortalwrt/immortalwrt.git
        cd immortalwrt
        echo "✅ Cloned branch: $(git branch --show-current)"

    - name: 💾 Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          immortalwrt/dl
          immortalwrt/build_dir
          immortalwrt/staging_dir
          immortalwrt/tmp
        key: ${{ runner.os }}-immortalwrt-ultra-minimal-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-ultra-minimal-

    - name: 📄 Generate Device Tree files
      run: |
        cd immortalwrt
        KERNEL_DIR="target/linux/msm89xx/files-6.6"
        mkdir -p $KERNEL_DIR/arch/arm64/boot/dts/qcom
        
        curl -s -o $KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        
        curl -s -o $KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts

    - name: ⚙️ Generate configuration files
      run: |
        cd immortalwrt
        KERNEL_DIR="target/linux/msm89xx/files-6.6"
        mkdir -p $KERNEL_DIR/etc/uci-defaults
        
        cat > $KERNEL_DIR/etc/uci-defaults/99-wifi-auto << 'EOF'
        #!/bin/sh
        sleep 3
        SSID="${WIFI_SSID:-J5-WiFi}"
        PASSWORD="${WIFI_PASSWORD:-12345678}"
        
        if [ -f /etc/config/wireless ]; then
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-iface[0].ssid="$SSID"
          uci set wireless.@wifi-iface[0].encryption='psk2'
          uci set wireless.@wifi-iface[0].key="$PASSWORD"
          uci commit wireless
          /etc/init.d/wireless restart
        fi
        EOF
        
        cat > $KERNEL_DIR/etc/uci-defaults/99-modem-auto << 'EOF'
        #!/bin/sh
        APN="${APN:-internet}"
        uci set network.wan=interface
        uci set network.wan.proto='qmi'
        uci set network.wan.device='/dev/cdc-wdm0'
        uci set network.wan.apn="$APN"
        uci commit network
        /etc/init.d/network restart
        EOF
        
        chmod +x $KERNEL_DIR/etc/uci-defaults/*
        echo "✅ Config files generated!"

    - name: 📝 Generate msm8916.mk
      run: |
        cd immortalwrt
        mkdir -p target/linux/msm89xx/image
        
        cat > target/linux/msm89xx/image/msm8916.mk << 'EOF'
        include $(TOPDIR)/rules.mk
        
        DEVICE_VARS += DEVICE_DTS
        
        define Device/Qcom
          DEVICE_VENDOR := Qualcomm
          IMAGES := combined.img rootfs.img
          KERNEL_LOADADDR := 0x80008000
          KERNEL_ENTRY := 0x80008000
          BOOT_SCRIPT := boot-msm89xx
          IMAGE_SIZE := 32m
          KERNEL := kernel-bin | gzip | fit gzip
          KERNEL_INITRAMFS := kernel-bin | gzip | fit gzip
          IMAGE/combined.img := append-kernel | append-rootfs | pad-rootfs | append-metadata
          IMAGE/rootfs.img := append-rootfs
        endef
        
        define Device/samsung-j5
          $(Device/Qcom)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5
          DEVICE_DTS := qcom/msm8916-samsung-j5
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm modemmanager
        endef
        TARGET_DEVICES += samsung-j5
        EOF
        
        echo "✅ msm8916.mk generated!"

    - name: 🔄 Update feeds
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: ⚙️ Generate ULTRA MINIMAL .config
      run: |
        cd immortalwrt
        
        WIFI_SSID="${{ github.event.inputs.wifi_ssid }}"
        WIFI_PASSWORD="${{ github.event.inputs.wifi_password }}"
        APN="${{ github.event.inputs.apn }}"
        
        cat > .config << 'EOF'
        CONFIG_TARGET_msm89xx=y
        CONFIG_TARGET_msm89xx_msm8916=y
        CONFIG_TARGET_msm89xx_msm8916_DEVICE_samsung-j5=y
        
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_dnsmasq=y
        
        CONFIG_PACKAGE_luci-light=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_iwinfo=y
        CONFIG_PACKAGE_wpad-basic=y
        CONFIG_PACKAGE_hostapd=y
        CONFIG_PACKAGE_wireless-tools=y
        
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        
        CONFIG_PACKAGE_busybox-config-mdev=y
        CONFIG_BUSYBOX_DEFAULT_FEATURE_EXTRA_QUIET=y
        CONFIG_BUSYBOX_DEFAULT_FEATURE_SYSLOG=y
        CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt -fhonour-copts -Wno-error=unused-but-set-variable -Wno-error=unused-result"
        CONFIG_STRIP_KERNEL_EXPORTS=y
        CONFIG_USE_SSTRIP=y
        EOF
        
        export WIFI_SSID="$WIFI_SSID"
        export WIFI_PASSWORD="$WIFI_PASSWORD"
        export APN="$APN"
        
        make defconfig
        echo "✅ ULTRA MINIMAL .config generated!"

    - name: 📥 Download sources
      run: |
        cd immortalwrt
        make download -j8 V=s

    - name: 🔨 Build firmware
      run: |
        cd immortalwrt
        echo "🚀 Building ULTRA MINIMAL firmware..."
        make -j4 V=s || make -j1 V=s
        echo "✅ Build completed!"

    - name: 📤 Upload firmware
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-j5-ultra-minimal-${{ github.run_number }}
        path: |
          immortalwrt/bin/targets/msm89xx/msm8916/*.img
          immortalwrt/bin/targets/msm89xx/msm8916/*.bin
          immortalwrt/bin/targets/msm89xx/msm8916/*.dtb
          immortalwrt/bin/targets/msm89xx/msm8916/*.manifest
          immortalwrt/.config
        retention-days: 7

    - name: 📤 Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-ultra-minimal-${{ github.run_number }}
        path: |
          immortalwrt/logs/
          immortalwrt/.config
        retention-days: 7

    - name: 🚀 Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: j5-ultra-minimal-${{ github.run_number }}
        name: 📦 ImmortalWrt J5 - ULTRA MINIMAL #${{ github.run_number }}
        body: |
          📱 ImmortalWrt for Samsung J5 - ULTRA MINIMAL
          
          📊 Build Info:
          Device: ${{ github.event.inputs.device_model }}
          WiFi SSID: ${{ github.event.inputs.wifi_ssid }}
          APN: ${{ github.event.inputs.apn }}
          
          📦 Included Packages (ONLY ESSENTIALS!):
          - Linux Kernel + Device Tree
          - BusyBox (core utilities)
          - Dropbear (SSH server)
          - Firewall + DNS
          - LuCI Light (web UI minimal)
          - WiFi (hostapd + wpad-basic)
          - Modem 4G (ModemManager + QMI)
          - curl + wget
          
          ❌ NOT INCLUDED:
          - WireGuard VPN
          - WiFi Schedule
          - Bluetooth
          - Audio
          - USB Storage
          - LuCI Apps
          - htop, nano, tcpdump
          - Samba, Docker
          
          📁 File Size: ~10-12 MB
          
          ⚠️ Flashing:
          1. Enter EDL mode
          2. Backup partitions
          3. Flash using QFIL/EDL
          4. Extract modem firmware
          
          🌐 Defaults:
          - IP: 192.168.1.1
          - WiFi: ${{ github.event.inputs.wifi_ssid }} / ${{ github.event.inputs.wifi_password }}
          - APN: ${{ github.event.inputs.apn }}
          
          ⚠️ Use at your own risk.
        files: |
          immortalwrt/bin/targets/msm89xx/msm8916/*.img
          immortalwrt/bin/targets/msm89xx/msm8916/*.bin
          immortalwrt/bin/targets/msm89xx/msm8916/*.dtb
          immortalwrt/bin/targets/msm89xx/msm8916/*.sha256sums
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}