name: Fetch and Analyze Build Logs

on:
  workflow_dispatch:  # Memungkinkan Anda menjalankan script ini manual dari tab Actions
    inputs:
      run_id:
        description: 'ID dari Run yang ingin dicek (contoh: 31163556326)'
        required: true
        type: string

jobs:
  analyze-logs:
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Izin untuk membaca log dari workflow lain
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || { echo "Installing gh CLI..."; sudo apt update && sudo apt install -y gh; }

      - name: Analyze Failed Build Logs
        env:
          GH_TOKEN: ${{ github.token }} # Token otomatis untuk autentikasi
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          echo "📋 Menganalisis Run ID: $RUN_ID"
          echo ""

          # 1. Cari baris yang mengandung error (Paling penting)
          echo "🔎 MENCARI PENYEBUT UTAMA ERROR (Make/GCC):"
          echo "------------------------------------------------"
          # Mencari kata kunci error dan menampilkan 10 baris konteks di sekitarnya
          gh run view $RUN_ID --log-failed --repo ${{ github.repository }} | \
            grep -E "Error|make.*Error|fatal:|Undefined|Permission denied|Error [0-9]+|collect2" \
            -B 5 -A 10 --color=always || echo "✅ Tidak ditemukan error tipikal di bagian log yang diambil."
          echo ""

          # 2. Ambil 100 baris TERAKHIR (Untuk memastikan di mana build berhenti)
          echo "🔎 100 BARIS TERAKHIR LOG (Akhir proses):"
          echo "------------------------------------------------"
          gh run view $RUN_ID --log-failed --repo ${{ github.repository }} | tail -n 100
          echo ""

          # 3. Ambil 100 baris PERTAMA (Untuk melihat tahap awal, jika gagal di setup)
          echo "🔎 100 BARIS PERTAMA LOG (Setup & konfigurasi awal):"
          echo "------------------------------------------------"
          gh run view $RUN_ID --log-failed --repo ${{ github.repository }} | head -n 100
          echo ""